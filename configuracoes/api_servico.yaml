# Instância exclusiva do projeto Steam. Outros projetos usam outros ambientes.
api:
  inferencia:
    tamanho_maximo_lote: 1000
  modelo:
    nome: steam_reviews
    modelo_mlflow: agrupamento_steam_kmeans
    alias: champion
    colunas:
      - playtime_forever
      - playtime_at_review
      - playtime_last_two_weeks
      - num_reviews
      - votes_up
      - votes_funny
      - weighted_vote_score
      - comment_count
      - voted_up
      - steam_purchase
      - received_for_free
      - written_during_early_access
    perfis: {} # Preencher somente após interpretar e aprovar os clusters reais.

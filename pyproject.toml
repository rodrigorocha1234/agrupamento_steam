[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "steam-reviews-brasil"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "scikit-learn>=1.5", "PyYAML>=6.0", "requests>=2.32", "prometheus-client>=0.21", "mlflow==3.4.0", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.9"]
[project.optional-dependencies]
pycaret = ["pycaret>=4.0,<5.0"]

dev = ["pytest>=8", "mypy>=1.12", "ruff>=0.7", "pandas-stubs>=2.2", "types-PyYAML", "types-requests", "httpx>=0.27"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
[tool.ruff]
target-version = "py312"
